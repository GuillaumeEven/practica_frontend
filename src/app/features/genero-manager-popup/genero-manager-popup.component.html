<div class="dialog-overlay"></div>
<div class="dialog-box" role="dialog" aria-modal="true" aria-label="Gestionar géneros">
  <div class="popup">
    <header>
      <h2>Gestionar géneros</h2>
    </header>

    <section>
      <ul>
        <li *ngFor="let g of items; let i = index">
          <ng-container *ngIf="editIdx !== i">
            <span class="item-label">{{ g.nombre }}</span>
            <span class="item-actions">
              <button type="button" class="row-icon-btn" aria-label="Editar" (click)="startEdit(i)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden>
                  <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25z" fill="currentColor"/>
                  <path d="M20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" fill="currentColor"/>
                </svg>
              </button>
              <button type="button" class="row-icon-btn" aria-label="Eliminar" (click)="deleteItem(i)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden>
                  <path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12z" fill="currentColor"/>
                  <path d="M19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" fill="currentColor"/>
                </svg>
              </button>
            </span>
          </ng-container>
          <ng-container *ngIf="editIdx === i">
            <input [(ngModel)]="editName" />
            <button type="button" (click)="saveEdit()">Guardar</button>
            <button type="button" (click)="cancelEdit()">Cancelar</button>
          </ng-container>
        </li>
      </ul>
    </section>

    <section class="new-item">
      <input placeholder="Nuevo género" [(ngModel)]="newName" />
      <button type="button" (click)="createNew()">Añadir</button>
    </section>

    <footer class="dialog-actions">
      <button type="button" (click)="onSaveAll()">Cerrar y guardar</button>
      <button type="button" (click)="onCancel()">Cancelar</button>
    </footer>
  </div>
</div>
